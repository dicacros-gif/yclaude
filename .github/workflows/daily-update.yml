name: Daily Shorts Update

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC = 17:00 KST
  workflow_dispatch:        # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install \
            google-api-python-client \
            yt-dlp \
            requests \
            beautifulsoup4

      - name: Fetch trending Shorts (17개국)
        run: python fetch_shorts.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PYTHONIOENCODING: utf-8

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos_*.json index.html
          git diff --staged --quiet || \
            git commit -m "chore: daily shorts update $(date +'%Y-%m-%d %H:%M KST')"
          git push
